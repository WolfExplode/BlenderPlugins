name: Release Add-ons

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.08.13). Leave blank to use today's date."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Determine tag
        id: vars
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(date -u +%Y.%m.%d)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package add-ons
        run: python scripts/package_addons.py --out dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip
